[project]
name = "lockss-projectoscope"
version = "0.1.0-dev1" # Always change in __init__.py, and at release time in README.rst and CHANGELOG.rst
description = "Web application and suite of tools to manage integrated LOCKSS preservation workflows"
license = { text = "BSD-3-Clause" }
readme = "README.rst"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Thib Guicherd-Callin",email = "thib@cs.stanford.edu" },
]
maintainers = [
    { name = "Thib Guicherd-Callin", email = "thib@cs.stanford.edu" },
]
dependencies = [
    "alembic (>=1.20.0,<1.21.0)", # not yet in use
    "bcrypt (>=5.0.0,<5.1.0)",
    "boltons (>=26.2.0,<26.3.0)",
    "click-extra (>=9.5.0,<9.6.0)",
    "doit (>=0.37.0,<0.38.0)",
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "fastapi-ldap (>=0.1.3,<0.2.0)",
    "lockss-pybasic (==0.3.0.dev25)",
    "pydantic (>=2.14.0,<2.15.0)", # required by sqlmodel
    "pydantic_core (>=2.50.0,<2.51.0)",
    "pyjwt (>=2.15.0,<2.16.0)",
    "python-dotenv (>=1.2.0,<1.3.0)",
    "sqlalchemy (>=2.1.0,<2.2.0)", # required by sqlmodel; see also sqlite group
    "sqlmodel (>=0.0.48,<0.0.49)",
    "starlette (>=0.46.0)", # fastapi requires >=0.46.0, starlette-admin >=0.40.0
    "starlette-admin (>=1.0.0,<1.1.0)",
]

[dependency-groups]
sqlite = [
    "aiosqlite (>=0.22.0,<0.23.0)",
    "sqlalchemy[asyncio] (>=2.1.0,<2.2.0)",
]

[tool.poetry]
include = [
    "CHANGELOG.rst",
    "LICENSE",
    "README.rst",
]
packages = [
    { include = "lockss", from = "src" }
]

[tool.poetry.group.sqlite]
optional = true

[tool.poetry.scripts]
projcli = 'lockss.projectoscope.cli:main'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
