[project]
name = "lockss-projectoscope"
version = "0.1.0-dev1" # Always change in __init__.py, and at release time in README.rst and CHANGELOG.rst
description = "Web application and suite of tools to manage integrated LOCKSS preservation workflows"
license = { text = "BSD-3-Clause" }
readme = "README.rst"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Thib Guicherd-Callin",email = "thib@cs.stanford.edu" },
]
maintainers = [
    { name = "Thib Guicherd-Callin", email = "thib@cs.stanford.edu" },
]
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "fastapi-ldap (>=0.1.3,<0.2.0)",
    "pyjwt (>=2.15.0,<2.16.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
include = [
    "CHANGELOG.rst",
    "LICENSE",
    "README.rst",
]
packages = [
    { include = "lockss/projectoscope", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
